# Data Journal — Global Configuration
# Copy to settings.local.yaml for local overrides (gitignored)

system:
  name: "Data Journal"
  version: "0.1.0"
  log_level: INFO
  log_format: json

orchestrator:
  max_concurrent_agents: 5
  scheduling:
    strategy: priority  # priority | round_robin | budget_aware
    tick_interval_seconds: 60
  persistence:
    state_file: orchestrator/state.json
    event_log: orchestrator/events.jsonl

budget:
  global_pool:
    max_tokens: 10000000
    max_cost_usd: 500.00
  default_project:
    max_tokens: 500000
    max_api_calls: 200
    max_cost_usd: 25.00
  alerts:
    warn_at_percent: 75
    critical_at_percent: 90

ai_client:
  default_provider: anthropic
  default_model: claude-sonnet-4-20250514
  anthropic:
    api_key_env: ANTHROPIC_API_KEY
    max_retries: 3
    timeout_seconds: 120
  model_routing:
    planning: claude-sonnet-4-20250514
    drafting: claude-sonnet-4-20250514
    analysis: claude-haiku-4-20250414
    quality_check: claude-sonnet-4-20250514
    extraction: claude-haiku-4-20250414

crawling:
  rate_limit:
    requests_per_second: 1
    burst_limit: 5
  cache:
    enabled: true
    ttl_hours: 24
    max_size_mb: 500
  user_agent: "DataJournal-Research-Bot/1.0"
  timeout_seconds: 30
  max_retries: 3

report:
  default_template: academic_whitepaper
  default_citation_format: apa
  min_abstract_words: 150
  min_body_words: 3000
  readability_grade_range: [12, 16]
